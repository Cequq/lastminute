<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Улаанбаатарын кино театр, ресторан, салон, спортын талбайн хаах дөхсөн болон эрэлт багатай цагийг хямд захиал." />
    <meta name="theme-color" content="#0E1E28" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Хуудас ачаалахаас өмнө горимыг тохируулна (цайвар → бараан анивчихгүй) -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('lm.theme') || 'system';
          var d = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>LastMinute — Нэг боломж. Хоёр хожил.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
